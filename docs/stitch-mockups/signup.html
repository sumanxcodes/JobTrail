<body class="bg-surface h-full flex flex-col justify-center items-center text-on-surface p-md">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl p-xl shadow-[0px_10px_15px_rgba(0,0,0,0.1)] border border-outline-variant/30 flex flex-col gap-lg relative overflow-hidden">
<!-- Abstract Decoration -->
<div class="absolute top-0 right-0 -mr-16 -mt-16 w-32 h-32 bg-primary-container rounded-full blur-3xl opacity-30 pointer-events-none"></div>
<!-- Header -->
<div class="flex flex-col items-center text-center gap-sm mt-sm">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center text-on-primary mb-2 shadow-[0px_4px_6px_rgba(0,0,0,0.07)]">
<span class="material-symbols-outlined fill text-[28px]" data-icon="rocket_launch">rocket_launch</span>
</div>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Create account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join CareerTrack AI today.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- Email Field -->
<div class="relative group">
<input class="block w-full px-md py-3 text-on-surface bg-transparent border border-outline rounded-lg appearance-none focus:outline-none focus:ring-0 focus:border-primary peer font-body-lg text-body-lg" id="email" placeholder=" " required="" type="email"/>
<label class="absolute font-body-md text-body-md text-on-surface-variant duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-[0] bg-surface-container-lowest px-2 peer-focus:px-2 peer-focus:text-primary peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 left-3" for="email">Email address</label>
</div>
<!-- Password Field -->
<div class="relative group">
<input class="block w-full px-md py-3 text-on-surface bg-transparent border border-outline rounded-lg appearance-none focus:outline-none focus:ring-0 focus:border-primary peer font-body-lg text-body-lg" id="password" placeholder=" " required="" type="password"/>
<label class="absolute font-body-md text-body-md text-on-surface-variant duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-[0] bg-surface-container-lowest px-2 peer-focus:px-2 peer-focus:text-primary peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 left-3" for="password">Password</label>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-outline hover:text-on-surface-variant focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Password Requirements Checklist (Simulated State) -->
<div class="flex flex-col gap-1 px-1">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-[16px] fill" data-icon="check_circle">check_circle</span>
<span class="font-label-sm text-label-sm">At least 8 characters</span>
</div>
<div class="flex items-center gap-2 text-outline-variant">
<span class="material-symbols-outlined text-[16px]" data-icon="radio_button_unchecked">radio_button_unchecked</span>
<span class="font-label-sm text-label-sm">Contains a number</span>
</div>
<div class="flex items-center gap-2 text-outline-variant">
<span class="material-symbols-outlined text-[16px]" data-icon="radio_button_unchecked">radio_button_unchecked</span>
<span class="font-label-sm text-label-sm">Contains a special character</span>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-sm mt-sm">
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-3 rounded-full hover:bg-on-primary-fixed-variant transition-colors shadow-[0px_1px_3px_rgba(0,0,0,0.1)] active:scale-[0.98]" type="submit">
                    Sign up
                </button>
<button class="w-full bg-transparent border border-outline text-on-surface font-label-lg text-label-lg py-3 rounded-full hover:bg-surface-container-low transition-colors flex items-center justify-center gap-2 active:scale-[0.98]" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="magic_button">magic_button</span>
                    Sign up with Magic Link
                </button>
</div>
</form>
<!-- Footer Links -->
<div class="text-center mt-2">
<span class="font-body-md text-body-md text-on-surface-variant">Already have an account? </span>
<a class="font-label-lg text-label-lg text-primary hover:underline font-medium" href="#">Log in</a>
</div>
