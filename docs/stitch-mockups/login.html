<!DOCTYPE html>

        @layer utilities {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-surface text-on-surface font-body-lg text-body-lg min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Canvas - Auth Focused -->
<main class="flex-grow flex items-center justify-center p-md md:p-lg">
<!-- Auth Container -->
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-xl flex flex-col gap-xl relative overflow-hidden">
<!-- Subtle decorative background element for depth -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container/10 rounded-bl-full -z-10 blur-2xl"></div>
<!-- Header -->
<div class="flex flex-col items-center text-center gap-sm">
<!-- Logo -->
<div class="flex items-center gap-2 text-primary mb-md">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">work</span>
<span class="font-headline-sm text-headline-sm font-bold tracking-tight">CareerTrack AI</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">Sign in</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back. Please enter your details.</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-lg" method="POST" onsubmit="event.preventDefault();">
<!-- Email Field (M3 Outlined Style) -->
<div class="relative group">
<input class="peer w-full h-[56px] bg-transparent border border-outline text-on-surface rounded-DEFAULT px-md font-body-lg text-body-lg focus:outline-none focus:border-primary focus:border-2 focus:ring-0 transition-colors placeholder-transparent" id="email" name="email" placeholder=" " required="" type="email"/>
<label class="absolute left-md top-1/2 -translate-y-1/2 font-body-lg text-body-lg text-on-surface-variant bg-surface-container-lowest px-1 transition-all duration-200 pointer-events-none peer-focus:top-0 peer-focus:text-primary peer-focus:font-label-sm peer-focus:text-label-sm peer-focus:translate-y-[-50%] peer-[:not(:placeholder-shown)]:top-0 peer-[:not(:placeholder-shown)]:font-label-sm peer-[:not(:placeholder-shown)]:text-label-sm peer-[:not(:placeholder-shown)]:translate-y-[-50%]" for="email">
                        Email
                    </label>
</div>
<!-- Password Field (M3 Outlined Style) -->
<div class="flex flex-col gap-sm">
<div class="relative group">
<input class="peer w-full h-[56px] bg-transparent border border-outline text-on-surface rounded-DEFAULT px-md font-body-lg text-body-lg focus:outline-none focus:border-primary focus:border-2 focus:ring-0 transition-colors placeholder-transparent" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="absolute left-md top-1/2 -translate-y-1/2 font-body-lg text-body-lg text-on-surface-variant bg-surface-container-lowest px-1 transition-all duration-200 pointer-events-none peer-focus:top-0 peer-focus:text-primary peer-focus:font-label-sm peer-focus:text-label-sm peer-focus:translate-y-[-50%] peer-[:not(:placeholder-shown)]:top-0 peer-[:not(:placeholder-shown)]:font-label-sm peer-[:not(:placeholder-shown)]:text-label-sm peer-[:not(:placeholder-shown)]:translate-y-[-50%]" for="password">
                            Password
                        </label>
<!-- Optional Visibility Toggle -->
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="font-label-lg text-label-lg text-primary hover:text-primary-fixed-dim focus:outline-none focus:underline transition-colors" href="#">
                            Forgot password?
                        </a>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-md mt-sm">
<!-- Primary Button -->
<button class="w-full h-[48px] bg-primary text-on-primary font-label-lg text-label-lg font-medium rounded-full hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm" type="submit">
                        Login
                    </button>
<!-- Divider -->
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-md font-body-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Secondary Button -->
<button class="w-full h-[48px] bg-transparent border border-outline text-secondary font-label-lg text-label-lg font-medium rounded-full hover:bg-surface-container hover:text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-surface-container-lowest active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-[20px]">magic_button</span>
                        Magic Link
                    </button>
</div>
</form>
<!-- Sign Up Prompt -->
<div class="text-center font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-lg text-label-lg text-primary font-medium hover:underline focus:outline-none focus:underline ml-1" href="#">
                    Sign up
                </a>
</div>
</div>
</main>
<!-- Minimal Footer Context -->
<footer class="bg-surface-container-lowest py-8 mt-auto border-t border-outline-variant flex flex-col justify-center items-center gap-md">
<p class="font-label-sm text-label-sm text-secondary opacity-80">
            © 2024 CareerTrack AI. All rights reserved.
        </p>
<div class="flex gap-lg">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors" href="#">Terms of Service</a>
</div>
</footer>
